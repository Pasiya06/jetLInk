name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile_app/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile_app/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK Build Type (release embeds the JS bundle and runs standalone; debug needs a Metro dev server)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - both
      api_url:
        description: 'Custom Backend API URL (optional override)'
        required: false
        type: string
  workflow_call:
    inputs:
      build_type:
        required: false
        default: 'release'
        type: string
      api_url:
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Source Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile_app/package-lock.json

      - name: 🤖 Configure Android SDK & Licenses
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Install Node Dependencies
        run: |
          cd mobile_app
          npm install --legacy-peer-deps

      - name: ⚙️ Generate Android Native Project (Expo Prebuild)
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url || secrets.EXPO_PUBLIC_API_URL || vars.EXPO_PUBLIC_API_URL || 'https://caffeinic-maximiliano-incidentless.ngrok-free.dev/api' }}
          EXPO_PUBLIC_OPENWEATHER_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENWEATHER_API_KEY || '75bef07e0055444197216e732279c66e' }}
        run: |
          cd mobile_app
          npx expo prebuild --platform android --clean

      - name: 🧠 Tune Gradle Memory
        # android/ is regenerated by prebuild, so these must be applied after it.
        # Default 2 GB heap runs out during D8 dex merging; runners have 16 GB.
        run: |
          cd mobile_app/android
          sed -i '/^org.gradle.jvmargs=/d;/^kotlin.daemon.jvmargs=/d;/^org.gradle.workers.max=/d;/^reactNativeArchitectures=/d' gradle.properties
          cat >> gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g
          org.gradle.workers.max=2
          reactNativeArchitectures=armeabi-v7a,arm64-v8a
          EOF
          echo "=== gradle.properties ==="
          cat gradle.properties

      - name: 🔨 Build APK with Gradle
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url || secrets.EXPO_PUBLIC_API_URL || vars.EXPO_PUBLIC_API_URL || 'https://caffeinic-maximiliano-incidentless.ngrok-free.dev/api' }}
          EXPO_PUBLIC_OPENWEATHER_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENWEATHER_API_KEY || '75bef07e0055444197216e732279c66e' }}
        run: |
          cd mobile_app/android
          chmod +x gradlew

          if [ "$BUILD_TYPE" = "debug" ]; then
            echo "Building Debug APK (requires Metro dev server; will stay on splash otherwise)..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          elif [ "$BUILD_TYPE" = "release" ]; then
            echo "Building Release APK (standalone, JS bundle embedded, signed with debug keystore)..."
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "Building both Debug and Release APKs..."
            ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
          fi

      - name: 📂 Collect Generated APKs
        run: |
          mkdir -p build-artifacts
          find mobile_app/android/app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} build-artifacts/ \;
          echo "=== Collected APK Files ==="
          ls -la build-artifacts/

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JetLink-Android-APK
          path: build-artifacts/*.apk
          retention-days: 30
